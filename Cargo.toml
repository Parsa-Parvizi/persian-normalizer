[package]
name = "persian-normalizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Small, fast, zero-copy-when-possible Persian (Farsi) text normalization"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Parsa-Parvizi/persian-normalizer"
documentation = "https://docs.rs/persian-normalizer"
keywords = ["persian", "farsi", "normalization", "text-processing", "unicode"]
categories = ["text-processing", "internationalization", "no-std"]
exclude = [".github/", "fuzz/", "tests/fixtures/", "deny.toml", "clippy.toml"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.8.2"
serde_json = "1"

[[bench]]
name = "normalize"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"