name: Release

# Publishes to crates.io with Trusted Publishing (OIDC): no long-lived API token
# is stored anywhere. One-time setup:
#   1. crates.io -> persian-normalizer -> Settings -> Trusted Publishing -> add:
#        repository owner: Parsa-Parvizi
#        repository name:  persian-normalizer
#        workflow file:    release.yml
#        environment:      crates-io
#   2. GitHub -> Settings -> Environments -> New environment "crates-io"
#      (optionally add yourself as a required reviewer for a manual approval step).
#
# Release steps: update CHANGELOG.md and the version in Cargo.toml, merge the pull
# request, then push a tag such as v0.1.1 from the merged commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # needed to obtain the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
